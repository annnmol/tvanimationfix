name: TV Animation Fix Android release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          for secret in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD KEYSTORE_BASE64; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing GitHub Actions secret: $secret"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.keystore"
          chmod 600 "$RUNNER_TEMP/release-signing.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-signing.keystore
        run: ./gradlew assembleRelease --no-daemon

      - name: Build signed release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-signing.keystore
        run: ./gradlew bundleRelease --no-daemon

      - name: Prepare release version and files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for release_attempt in 1 2 3 4 5; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
              > "$RUNNER_TEMP/tvanimationfix-tags.json"
            release_tag="$(jq -r \
              '"1.0." + (([.[][] | .name | select(test("^1\\.0\\.[0-9]+$")) | split(".")[2] | tonumber] | max // 0) + 1 | tostring)' \
              "$RUNNER_TEMP/tvanimationfix-tags.json")"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$release_tag" -f "sha=$GITHUB_SHA" --silent; then
              break
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --silent
            if [ "$release_attempt" -eq 5 ]; then
              echo "::error::Could not reserve the next release version"
              exit 1
            fi
          done
          echo "TVANIMATIONFIX_RELEASE_VERSION=$release_tag" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/tvanimationfix_${release_tag}.apk"
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/tvanimationfix_${release_tag}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/tvanimationfix_${release_tag}_mapping.txt"
          if [ -f app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip ]; then
            cp app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip "$RUNNER_TEMP/tvanimationfix_${release_tag}_native-symbols.zip"
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/tvanimationfix_${{ env.TVANIMATIONFIX_RELEASE_VERSION }}.apk
          archive: false
          if-no-files-found: error

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/tvanimationfix_${{ env.TVANIMATIONFIX_RELEASE_VERSION }}.aab
          archive: false
          if-no-files-found: error

      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/tvanimationfix_${{ env.TVANIMATIONFIX_RELEASE_VERSION }}_mapping.txt
          archive: false
          if-no-files-found: error

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/tvanimationfix_${{ env.TVANIMATIONFIX_RELEASE_VERSION }}_native-symbols.zip
          archive: false
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_files=(
            "$RUNNER_TEMP/tvanimationfix_${TVANIMATIONFIX_RELEASE_VERSION}.apk"
            "$RUNNER_TEMP/tvanimationfix_${TVANIMATIONFIX_RELEASE_VERSION}.aab"
            "$RUNNER_TEMP/tvanimationfix_${TVANIMATIONFIX_RELEASE_VERSION}_mapping.txt"
          )
          if [ -f "$RUNNER_TEMP/tvanimationfix_${TVANIMATIONFIX_RELEASE_VERSION}_native-symbols.zip" ]; then
            release_files+=("$RUNNER_TEMP/tvanimationfix_${TVANIMATIONFIX_RELEASE_VERSION}_native-symbols.zip")
          fi
          gh release create "$TVANIMATIONFIX_RELEASE_VERSION" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "tvanimationfix_${TVANIMATIONFIX_RELEASE_VERSION}" \
            --generate-notes \
            --latest

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.keystore"
